<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="50%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#050816"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <linearGradient id="glow2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="ctoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0072ff"/>
    </linearGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#00f0ff" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="200" cy="150" r="350" fill="url(#glow1)"/>
  <circle cx="1000" cy="480" r="350" fill="url(#glow2)"/>
  <!-- Grid pattern -->
  <g opacity="0.04" stroke="#00f0ff" stroke-width="0.5">
    <line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="158" x2="1200" y2="158"/>
    <line x1="0" y1="315" x2="1200" y2="315"/><line x1="0" y1="473" x2="1200" y2="473"/>
    <line x1="0" y1="0" x2="0" y2="630"/><line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="900" y1="0" x2="900" y2="630"/>
  </g>
  <!-- Connecting particles -->
  <g opacity="0.08" stroke="#00f0ff" stroke-width="1">
    <line x1="100" y1="100" x2="300" y2="200"/><line x1="300" y1="200" x2="250" y2="350"/>
    <line x1="900" y1="450" x2="1050" y2="300"/><line x1="1050" y1="300" x2="1100" y2="500"/>
  </g>
  <g fill="#00f0ff" opacity="0.15">
    <circle cx="100" cy="100" r="2"/><circle cx="300" cy="200" r="2"/><circle cx="250" cy="350" r="2"/>
    <circle cx="900" cy="450" r="2"/><circle cx="1050" cy="300" r="2"/><circle cx="1100" cy="500" r="2"/>
  </g>
  <!-- Top badge -->
  <rect x="420" y="140" width="360" height="28" rx="14" fill="none" stroke="#00f0ff" stroke-opacity="0.3" stroke-width="1"/>
  <text x="600" y="159" text-anchor="middle" font-family="monospace" font-size="11" fill="#00f0ff" opacity="0.8" letter-spacing="3">SECURE BOOT // SYSTEM OPERATIONAL</text>
  <!-- Main title -->
  <text x="600" y="310" text-anchor="middle" font-family="sans-serif" font-size="88" font-weight="900" fill="url(#textGrad)" letter-spacing="-3">ORBIT</text>
  <text x="600" y="400" text-anchor="middle" font-family="sans-serif" font-size="88" font-weight="900" fill="url(#ctoGrad)" letter-spacing="-3">CTO X</text>
  <!-- Subtitle -->
  <text x="600" y="460" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#94a3b8" font-weight="500">The Autonomous Operating System For Software Companies</text>
  <!-- Bottom indicators -->
  <g font-family="monospace" font-size="11" fill="#64748b">
    <text x="300" y="520" text-anchor="middle">AGENTS: <tspan fill="#a855f7" font-weight="bold">ACTIVE (7/7)</tspan></text>
    <text x="600" y="520" text-anchor="middle">HEALTH: <tspan fill="#10b981" font-weight="bold">98.4% NOMINAL</tspan></text>
    <text x="900" y="520" text-anchor="middle">SYS-LOG: <tspan fill="#00f0ff" font-weight="bold">READY</tspan></text>
  </g>
  <!-- Divider line -->
  <line x1="200" y1="495" x2="1000" y2="495" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
</svg>