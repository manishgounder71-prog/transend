# =============================================================
# Orbit CTO X — Nginx Reverse Proxy Configuration
# =============================================================
# This config sits in front of the Next.js app container and
# handles SSL termination, caching, security headers, and
# production routing.
# =============================================================

upstream orbit_app {
    server app:3000;
    keepalive 64;
}

# ── HTTP → HTTPS Redirect (production) ─────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # For Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS Server (production) ──────────────────
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    # SSL certificates (mount from host or certbot)
    ssl_certificate     /etc/nginx/ssl/orbit.crt;
    ssl_certificate_key /etc/nginx/ssl/orbit.key;

    # Modern TLS configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=60s;
    resolver_timeout 2s;

    # Security headers
    include /etc/nginx/security-headers.conf;

    # ── Static Asset Caching ──────────────────
    # Next.js serves its own static files through the upstream server.
    # We proxy through and add aggressive caching headers.
    location /_next/static/ {
        proxy_pass http://orbit_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 365d;
        add_header Cache-Control "public, immutable, must-revalidate";
        access_log off;
    }

    location /static/ {
        proxy_pass http://orbit_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable, must-revalidate";
        access_log off;
    }

    # ── Favicon & Robots ─────────────────────
    location = /favicon.ico {
        proxy_pass http://orbit_app;
        access_log off;
        log_not_found off;
        expires 30d;
    }

    location = /robots.txt {
        proxy_pass http://orbit_app;
        access_log off;
        log_not_found off;
    }

    location = /og-image.svg {
        proxy_pass http://orbit_app;
        expires 30d;
    }

    # ── API Proxy ─────────────────────────────
    location /api/ {
        proxy_pass http://orbit_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Don't cache API responses
        add_header Cache-Control "no-store";
    }

    # ── Main App Proxy ────────────────────────
    location / {
        proxy_pass http://orbit_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # Gzip compression
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
        gzip_min_length 1000;
        gzip_comp_level 6;
        gzip_vary on;
    }

    # ── Deny access to hidden files ───────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
