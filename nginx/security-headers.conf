# ── Security Headers ─────────────────────────────
# These headers harden the application against common
# web vulnerabilities. Included by nginx.conf.

# Prevent MIME type sniffing
add_header X-Content-Type-Options "nosniff" always;

# Prevent clickjacking
add_header X-Frame-Options "SAMEORIGIN" always;

# Enable XSS filter in older browsers
add_header X-XSS-Protection "1; mode=block" always;

# Strict Transport Security (only when HTTPS is enabled)
# 6 months = 15768000 seconds; includeSubDomains; preload
# Uncomment the line below after SSL is configured:
# add_header Strict-Transport-Security "max-age=15768000; includeSubDomains; preload" always;

# Referrer policy
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions policy (restrict browser features)
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

# Content Security Policy (single line — Nginx does not support multi-line add_header)
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://gitlab.com; frame-ancestors 'none';" always;
